{% extends "base.html" %}
{% block content %}
<h2>Danh sách sách</h2>
<form method="get" class="row">
  <input name="q" placeholder="Tìm theo tên hoặc tác giả" value="{{ q }}">
  <button>Tìm</button>
</form>
<form method="post" action="{{ url_for('add_book') }}" class="row">
  <input name="title" placeholder="Tên sách" required>
  <input name="author" placeholder="Tác giả" required>
  <input name="isbn" placeholder="ISBN">
  <input name="quantity" type="number" min="1" value="1" required>
  <button>Thêm sách</button>
</form>
<table>
  <tr><th>ID</th><th>Tên sách</th><th>Tác giả</th><th>ISBN</th><th>Còn lại</th><th></th></tr>
  {% for b in books %}
  <tr>
    <td>{{ b.id }}</td><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.isbn or '' }}</td><td>{{ b.quantity }}</td>
    <td><form method="post" action="{{ url_for('delete_book', book_id=b.id) }}"><button>Xóa</button></form></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
